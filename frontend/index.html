<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CNR Design Studio - architectural design by Chanaka Rambukwella, Chartered Architect." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CNR Design Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" />
    <script>
      // Apply the saved theme before React loads, so the page never flashes the wrong colours.
      try { if (localStorage.getItem('cnrTheme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
